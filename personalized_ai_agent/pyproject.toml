[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personalized-ai-agent"
version = "0.1.0"
description = "A local-profile, session-based personalized AI chat assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project Elite contributors" }]

[project.scripts]
personal-agent = "personalized_ai_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
